name: IHS sync

on:
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tam-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the TAM technical health score page
        run: node scripts/tam-sync.mjs
      - name: Publish the snapshot
        run: |
          git add site/tam-snapshot.js
          if git diff --cached --quiet; then
            echo "No TAM changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh TAM health snapshot."
          git push
